<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sonex Apple Mode</title>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 70% 10%, #4f3d49, #161519 55%); color: #f8f3f5; }
    main { width: min(34rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #756a72;
      border-radius: 1.2rem; background: rgba(28, 26, 30, .88); box-shadow: 0 1.5rem 5rem #0008; }
    h1 { margin: 0 0 .5rem; font-size: 1.3rem; background: linear-gradient(90deg,#c7cad1,#d8c4ce,#f0d2df);
      color: transparent; background-clip: text; }
    .status { color: #d8c4ce; margin-bottom: 1.5rem; }
    .track { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem; align-items: center; }
    img { width: 5rem; height: 5rem; border-radius: .6rem; object-fit: cover; background: #29262b; }
    .name { font-size: 1.05rem; } .artist { color: #aaa1a8; margin-top: .3rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.5rem; }
    button { border: 1px solid #887984; border-radius: 999px; padding: .65rem 1rem;
      color: #fff; background: #352f34; cursor: pointer; }
    button.primary { color: #201b1f; border: 0; background: linear-gradient(90deg,#c7cad1,#d8c4ce,#f0d2df); }
    footer { margin-top: 1.5rem; color: #8f878d; font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>Apple Mode</h1>
  <div class="status" id="status">Connecting to Sonex…</div>
  <div class="track">
    <img id="cover" alt="">
    <div><div class="name" id="name">No song playing</div><div class="artist" id="artist">Apple Music</div></div>
  </div>
  <div class="actions">
    <button class="primary" id="authorize">Authorize Apple Music</button>
    <button id="reauthorize">Reauthorize</button>
    <button id="disconnect">Disconnect</button>
  </div>
  <footer>Keep this page open while listening. Search and playback controls stay in Sonex.</footer>
</main>
<script>
(() => {
  const fragment = new URLSearchParams(location.hash.slice(1));
  const secret = fragment.get("session") || "";
  history.replaceState(null, "", location.pathname);
  const status = document.getElementById("status");
  const authorizeButton = document.getElementById("authorize");
  const reauthorizeButton = document.getElementById("reauthorize");
  const disconnectButton = document.getElementById("disconnect");
  const nameNode = document.getElementById("name");
  const artistNode = document.getElementById("artist");
  const coverNode = document.getElementById("cover");
  let socket;
  let music;
  let storefront = "";
  let canPlay = false;
  let configured = false;
  let eventListenersInstalled = false;
  let reconnectEnabled = true;
  let disconnectPauseTimer;

  const normalizedTrack = item => {
    if (!item) return {};
    const attrs = item.attributes || item;
    const artwork = attrs.artwork && attrs.artwork.url
      ? attrs.artwork.url.replace("{w}", "600").replace("{h}", "600")
      : attrs.album_cover_url || "";
    return {
      id: String(item.id || attrs.id || ""),
      uri: item.id ? `apple_music:song:${item.id}` : attrs.uri,
      name: attrs.name || attrs.title || "",
      title: attrs.name || attrs.title || "",
      artist: attrs.artistName || attrs.artist || "",
      album: attrs.albumName || attrs.album || "",
      duration_ms: Number(attrs.durationInMillis || attrs.duration_ms || 0),
      album_cover_url: artwork,
      url: attrs.url || attrs.apple_music_url || "",
      apple_music_url: attrs.url || attrs.apple_music_url || ""
    };
  };

  const queueItems = () => {
    const items = music && music.queue && music.queue.items ? Array.from(music.queue.items) : [];
    return items.map(normalizedTrack);
  };

  const publishState = () => {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    const item = music && music.nowPlayingItem;
    const track = normalizedTrack(item);
    const playing = Boolean(music && music.isPlaying);
    const player = {
      ...track,
      provider: "apple_music",
      source: "apple_music",
      is_playing: playing,
      playback_status: playing ? "playing" : "paused",
      progress_ms: Math.max(0, Number(music && music.currentPlaybackTime || 0) * 1000),
      timestamp: Date.now()
    };
    socket.send(JSON.stringify({
      type: "state",
      authorized: Boolean(music && music.isAuthorized),
      can_play: canPlay,
      storefront,
      player,
      queue: queueItems(),
      timestamp: Date.now()
    }));
    nameNode.textContent = track.name || "No song playing";
    artistNode.textContent = track.artist || "Apple Music";
    if (track.album_cover_url) coverNode.src = track.album_cover_url;
  };

  const loadAccount = async () => {
    if (!music || !music.isAuthorized) {
      canPlay = false;
      storefront = "";
      publishState();
      return;
    }
    const response = await music.api.music("/v1/me/storefront");
    const root = response && (response.data || response);
    const rows = root && root.data ? root.data : [];
    storefront = rows[0] && rows[0].id ? String(rows[0].id).toLowerCase() : "";
    if (!storefront) {
      canPlay = false;
      publishState();
      return;
    }
    try {
      // A personalized subscriber endpoint is used only as a capability probe;
      // its response is never sent to Sonex or rendered by the companion.
      await music.api.music("/v1/me/recommendations", { limit: 1 });
      canPlay = true;
    } catch (_) {
      canPlay = false;
    }
    publishState();
  };

  const configure = async token => {
    music = await MusicKit.configure({
      developerToken: token,
      app: { name: "Sonex", build: "1.0.0" }
    });
    music = music || MusicKit.getInstance();
    configured = true;
    if (!eventListenersInstalled) {
      const events = MusicKit.Events || {};
      ["playbackStateDidChange", "nowPlayingItemDidChange", "queueItemsDidChange", "playbackTimeDidChange"]
        .forEach(name => events[name] && music.addEventListener(events[name], publishState));
      eventListenersInstalled = true;
    }
    await loadAccount().catch(() => publishState());
    authorizeButton.hidden = Boolean(music.isAuthorized);
    status.textContent = music.isAuthorized ? "Connected — return to Sonex" : "Authorization required";
  };

  const search = async payload => {
    const response = await music.api.music(`/v1/catalog/${storefront}/search`, {
      term: String(payload.query || ""),
      types: "songs",
      limit: Math.max(1, Math.min(25, Number(payload.limit || 10)))
    });
    const root = response && (response.data || response);
    const results = root && root.results ? root.results : {};
    const rows = results.songs && results.songs.data ? results.songs.data : [];
    return { tracks: rows.map(normalizedTrack) };
  };

  const execute = async message => {
    const payload = message.payload || {};
    const track = payload.track || {};
    if (!music || !music.isAuthorized || !canPlay) throw new Error("Apple Music authorization or subscription is unavailable.");
    switch (message.action) {
      case "search": return await search(payload);
      case "play":
        await music.setQueue({ song: String(track.id) });
        await music.play();
        break;
      case "queue_add":
        if (typeof music.playLater === "function") await music.playLater({ song: String(track.id) });
        else throw new Error("This MusicKit version cannot append to the queue.");
        break;
      case "pause": await music.pause(); break;
      case "resume": await music.play(); break;
      case "next": await music.skipToNextItem(); break;
      case "previous": await music.skipToPreviousItem(); break;
      case "clear_queue": await music.clearQueue(); break;
      case "logout":
        reconnectEnabled = false;
        await music.pause().catch(() => {});
        await music.unauthorize();
        canPlay = false; storefront = "";
        break;
      default: throw new Error("Unsupported Apple command.");
    }
    publishState();
    return {};
  };

  const connect = () => {
    socket = new WebSocket(`ws://${location.host}/ws`);
    socket.addEventListener("open", () => {
      socket.send(JSON.stringify({ type: "hello", secret }));
      status.textContent = "Connected to Sonex";
      clearTimeout(disconnectPauseTimer);
    });
    socket.addEventListener("message", async event => {
      const message = JSON.parse(event.data);
      if (message.type === "configure") {
        try { await configure(message.developer_token); }
        catch (_) { status.textContent = "MusicKit configuration failed"; }
        return;
      }
      if (message.type !== "command") return;
      try {
        const data = await execute(message);
        socket.send(JSON.stringify({ type: "command_result", id: message.id, ok: true, data }));
      } catch (error) {
        const errorStatus = Number(error && (error.status || error.statusCode || (error.response && error.response.status)) || 0);
        socket.send(JSON.stringify({
          type: "command_result",
          id: message.id,
          ok: false,
          error_status: errorStatus,
          error: String(error && error.message || error)
        }));
      }
    });
    socket.addEventListener("close", () => {
      status.textContent = "Sonex disconnected — playback will pause";
      disconnectPauseTimer = setTimeout(() => music && music.pause().catch(() => {}), 5000);
      if (reconnectEnabled) setTimeout(connect, 1000);
    });
  };

  authorizeButton.addEventListener("click", async () => {
    if (!music) return;
    try {
      await music.authorize();
      await loadAccount();
      authorizeButton.hidden = true;
      status.textContent = "Connected — return to Sonex";
    } catch (_) { status.textContent = "Apple Music authorization failed"; }
  });
  reauthorizeButton.addEventListener("click", async () => {
    if (!music) return;
    await music.unauthorize().catch(() => {});
    authorizeButton.hidden = false;
    canPlay = false; storefront = "";
    status.textContent = "Authorization required";
    publishState();
  });
  disconnectButton.addEventListener("click", () => socket && socket.close());
  connect();
})();
</script>
</body>
</html>
