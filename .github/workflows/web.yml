name: Sonex Web
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/web/**'
      - 'src/cli/src/types.ts'
      - 'src/main.py'
      - 'src/ws/**'
      - 'src/tools/playback_controller.py'
      - 'src/tools/mpv_ipc.py'
      - 'tests/test_web_runtime.py'
      - 'tests/test_playback_controller.py'
      - 'pyproject.toml'
      - '.github/workflows/web.yml'
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: src/web/frontend
      - run: npm run build
        working-directory: src/web/frontend
      - run: npm test
        working-directory: src/web/frontend
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_web_runtime.py tests/test_playback_controller.py
