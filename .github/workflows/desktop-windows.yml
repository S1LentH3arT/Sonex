name: Desktop Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/desktop/**'
      - 'src/ws/**'
      - 'src/tools/playback_controller.py'
      - 'src/tools/mpv_ipc.py'
      - '.github/workflows/desktop-windows.yml'
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: src/desktop
      - run: npm run build:web
        working-directory: src/desktop
      - run: npm test
        working-directory: src/desktop
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_desktop_runtime.py tests/test_playback_controller.py
      - run: cargo check
        working-directory: src/desktop/src-tauri
